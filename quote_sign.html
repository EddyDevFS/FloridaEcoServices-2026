<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote — Florida Eco Services</title>
  <link rel="stylesheet" href="styles.css?v=20260121" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	  <style>
	    body { background:#f8fafc; }
	    .qs-shell { max-width: 980px; margin: 28px auto; padding: 0 16px; }
	    .qs-card { background:#fff; border:1px solid #e2e8f0; border-radius:18px; padding: 16px; box-shadow:0 12px 40px rgba(0,0,0,0.06); }
	    .qs-head { display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
	    .qs-brand { display:flex; gap:12px; align-items:center; }
	    .qs-logo { width:44px; height:44px; border-radius:16px; display:grid; place-items:center; background:rgba(11,107,85,0.12); border:1px solid rgba(11,107,85,0.16); color:#0b6b55; }
	    .qs-title { margin:0; font-size: 22px; letter-spacing:-0.02em; }
	    .qs-sub { margin:4px 0 0; color:#64748b; font-weight:650; }
	    .qs-actions { display:flex; gap:10px; flex-wrap:wrap; }
	    .qs-grid { margin-top: 14px; display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
	    @media (max-width: 860px){ .qs-grid{grid-template-columns:1fr} }
	    .qs-offer { border:1px solid #e2e8f0; border-radius:16px; padding: 14px; background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); cursor:pointer; }
	    .qs-offer.active { outline: 4px solid rgba(11,107,85,0.20); border-color: rgba(11,107,85,0.30); box-shadow: 0 14px 30px rgba(11,107,85,0.10); }
	    .qs-offer h3 { margin:0; font-size: 14px; letter-spacing:-0.01em; }
	    .qs-offer .tagline { margin-top:6px; color:#64748b; font-weight:650; font-size:12px; line-height:1.35; }
	    .qs-price { margin-top: 12px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
	    .qs-price b { font-size: 20px; letter-spacing:-0.02em; }
	    .qs-price span { color:#64748b; font-weight:750; font-size:12px; }
	    .qs-mini { margin-top:10px; display:grid; gap:6px; }
	    .qs-mini .row { display:flex; justify-content:space-between; gap:10px; color:#0f172a; font-weight:800; font-size:12px; }
	    .qs-mini .row small { color:#64748b; font-weight:800; }
	    .qs-bullets { margin-top: 10px; display:grid; gap:8px; color:#0f172a; font-weight:650; }
	    .qs-bullets div { display:flex; gap:10px; align-items:flex-start; }
	    .qs-bullets i { margin-top:2px; color:#0b6b55; }
	    .qs-divider { margin: 14px 0; height:1px; background:#e2e8f0; }
	    .qs-scope { margin-top: 14px; display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
	    @media (max-width: 860px){ .qs-scope{grid-template-columns:1fr} }
	    .qs-scopeCard { border:1px solid #e2e8f0; border-radius:16px; padding: 12px; background: #fff; }
	    .qs-scopeCard .k { color:#64748b; font-weight:850; font-size:12px; }
	    .qs-scopeCard .v { margin-top:6px; font-weight:950; font-size:16px; color:#0f172a; }
	    .qs-scopeCard .v.small { font-size:14px; }
	    .qs-table { margin-top: 14px; border:1px solid #e2e8f0; border-radius:16px; overflow:hidden; }
	    .qs-table .row { display:grid; grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr 1fr; gap:0; }
	    .qs-table .row > div { padding: 10px 12px; border-bottom:1px solid #e2e8f0; font-weight:850; }
	    .qs-table .row.head { background:#f1f5f9; }
	    .qs-table .row.head > div { font-weight:950; color:#0f172a; border-bottom:1px solid #e2e8f0; }
	    .qs-table .row > div:nth-child(n+2){ text-align:right; }
	    .qs-table .row:last-child > div { border-bottom:none; }
	    .qs-table .mut { color:#64748b; font-weight:850; }
	    @media (max-width: 860px){
	      .qs-table .row { grid-template-columns: 1fr 1fr; }
	      .qs-table .row.head { display:none; }
	      .qs-table .row > div:nth-child(n+2){ text-align:left; }
	      .qs-table .row > div { border-bottom:none; padding: 8px 12px; }
	      .qs-table .row { border-bottom:1px solid #e2e8f0; padding: 6px 0; }
	      .qs-table .row:last-child { border-bottom:none; }
	      .qs-table .row > div:nth-child(odd){ color:#64748b; font-weight:850; }
	      .qs-table .row > div:nth-child(even){ font-weight:950; color:#0f172a; }
	    }
	    .qs-form { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
	    .qs-form .form-field { margin:0; }
	    .qs-form .full { grid-column: 1 / -1; }
	    @media (max-width: 720px){ .qs-form{grid-template-columns:1fr} }
	    .qs-status { margin-top: 10px; font-weight: 700; color:#64748b; }
	    .qs-success { background: rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.20); color:#065f46; padding: 12px; border-radius: 14px; font-weight: 800; }
	  </style>
</head>
<body>
  <div class="qs-shell">
    <div class="qs-card">
      <div class="qs-head">
        <div class="qs-brand">
          <div class="qs-logo"><i class="fa-solid fa-file-signature"></i></div>
          <div>
            <h1 class="qs-title">Quote</h1>
            <p class="qs-sub" id="qsMeta">Loading…</p>
          </div>
        </div>
        <div class="qs-actions">
          <a class="btn-secondary" href="index.html" style="text-decoration:none;"><i class="fa-solid fa-house"></i> Home</a>
          <button class="btn-secondary" id="qsDownloadBtn" type="button"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
          <button class="btn-secondary" id="qsPrintBtn" type="button"><i class="fa-solid fa-print"></i> Print</button>
        </div>
	      </div>

	      <div class="qs-scope" id="qsScope" style="display:none;"></div>

	      <div class="qs-grid" id="qsOffers"></div>

	      <div class="qs-table" id="qsPricingDetails" style="display:none;"></div>

	      <div class="qs-divider"></div>

      <div style="font-weight:950; letter-spacing:-0.01em;"><i class="fa-solid fa-pen-nib"></i> Digital signature</div>
      <p class="qs-sub" style="margin-top:6px;">Select an offer above, then sign. You will receive a confirmation email with a PDF copy.</p>

      <div class="qs-form" style="margin-top:12px;">
        <div class="form-field">
          <label for="qsName">Full name</label>
          <input id="qsName" type="text" placeholder="Full name" />
        </div>
        <div class="form-field">
          <label for="qsTitle">Role / title</label>
          <input id="qsTitle" type="text" placeholder="General Manager" />
        </div>
        <div class="form-field full">
          <label for="qsEmail">Email</label>
          <input id="qsEmail" type="email" placeholder="you@hotel.com" />
        </div>
      </div>

      <div style="margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn-primary" id="qsSignBtn" type="button"><i class="fa-solid fa-check"></i> Sign & accept</button>
        <div class="qs-status" id="qsStatus"></div>
      </div>

      <div id="qsSuccess" style="display:none; margin-top:12px;" class="qs-success"></div>
    </div>
  </div>

  <script src="app-config.js?v=20260121"></script>
  <script src="quote_sign.js?v=20260121"></script>
</body>
</html>
