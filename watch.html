<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Florida Eco Services — Video</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b6b55">
  <link rel="stylesheet" href="styles.css?v=20260128">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background:#0b1220; color: rgba(255,255,255,.92); }
    .shell { max-width: 1080px; margin: 18px auto; padding: 0 16px 24px; }
    .top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .brand { display:flex; gap:10px; align-items:center; }
    .logo { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background: rgba(11,107,85,.18); border:1px solid rgba(255,255,255,.10); }
    .brand h1 { margin:0; font-size: 18px; letter-spacing:-.01em; }
    .brand .sub { margin-top:2px; font-size:12px; opacity:.72; font-weight:700; }
    .meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .pill { display:inline-flex; gap:8px; align-items:center; padding:8px 10px; border-radius:999px; background: rgba(2,8,23,.55); border:1px solid rgba(255,255,255,.10); color: rgba(255,255,255,.88); font-weight:850; font-size:12px; }

    .player-card { margin-top: 14px; background:#000; border-radius:18px; overflow:hidden; border:1px solid rgba(255,255,255,0.10); box-shadow: 0 18px 54px rgba(0,0,0,0.30); }
    video { width:100%; height:auto; display:block; background:#000; }

    .info { margin-top: 12px; display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
    .info h2 { margin:0; font-size: 20px; letter-spacing:-.02em; }
    .info p { margin:6px 0 0; color: rgba(255,255,255,.72); font-weight:650; line-height:1.4; max-width: 70ch; }
    .btn { border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color:#fff; border-radius: 12px; padding: 10px 12px; font-weight: 900; display:inline-flex; gap:8px; align-items:center; cursor:pointer; }
    .btn:hover { background: rgba(255,255,255,.10); }

    .error { margin-top: 18px; padding: 12px; background: rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.25); border-radius: 14px; color: rgba(255,255,255,.92); font-weight: 800; }
    .hint { margin-top: 10px; color: rgba(255,255,255,.66); font-weight: 700; font-size: 12px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-leaf"></i></div>
        <div>
          <h1>Florida Eco Services</h1>
          <div class="sub">Video presentation</div>
        </div>
      </div>
      <div class="meta">
        <span class="pill" id="pillStatus"><i class="fa-solid fa-circle-info"></i> Loading…</span>
      </div>
    </div>

    <div class="player-card" id="playerCard" style="display:none;">
      <video id="video" controls playsinline preload="metadata"></video>
    </div>

    <div class="info" id="info" style="display:none;">
      <div>
        <h2 id="title">—</h2>
        <p id="desc"></p>
        <div class="hint">We track anonymous viewing progress (play time) to improve follow-up.</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
        <button class="btn" id="btnCopyLink" type="button"><i class="fa-regular fa-copy"></i> Copy link</button>
      </div>
    </div>

    <div class="error" id="err" style="display:none;"></div>
  </div>

  <script src="watch.js?v=20260128"></script>
</body>
</html>
